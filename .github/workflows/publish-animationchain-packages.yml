name: Publish AnimationChain Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override, e.g. 1.0.0-preview.1 (leave blank to auto-increment)'
        required: false
        default: ''

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "Using manual version: ${{ github.event.inputs.version }}"
            exit 0
          fi

          LATEST=$(curl -sf https://api.nuget.org/v3-flatcontainer/flatredball.animationchain.monogame/index.json | jq -r '.versions[-1]' || true)
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "::error::Could not fetch latest version from NuGet. Pass a version override for the first publish."
            exit 1
          fi

          # Increment the last numeric segment (e.g. 1.0.0-preview.3 -> 1.0.0-preview.4)
          PREFIX="${LATEST%.*}"
          LAST="${LATEST##*.}"
          NEXT="$PREFIX.$((LAST + 1))"

          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Auto-incremented from $LATEST to $NEXT"

  # Both AnimationChain.MonoGame and AnimationChain.KNI now ProjectReference AnimationEditorCommon
  # (see src/AnimationChain.MonoGame/AnimationChain.MonoGame.csproj), which auto-generates a matching
  # NuGet <dependency> at pack time -- that dependency must resolve to a real, matching-version
  # package on nuget.org, same lockstep requirement FlatRedBall2.MonoGame/Kni already have on it in
  # .github/workflows/publish.yml. Publish AnimationEditorCommon here too (this workflow runs
  # independently of publish.yml) before packing the AnimationChain packages.
  publish-animationeditorcommon:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/AnimationEditorCommon/FlatRedBall2.AnimationEditorCommon.csproj

      - name: Build and Pack (FlatRedBall2.AnimationEditorCommon)
        run: >
          dotnet pack src/AnimationEditorCommon/FlatRedBall2.AnimationEditorCommon.csproj
          -c Release
          -p:PackageVersion=${{ needs.resolve-version.outputs.version }}
          -o out

      - name: Publish to NuGet
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish:
    needs: [resolve-version, publish-animationeditorcommon]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: src/AnimationChain.MonoGame/AnimationChain.MonoGame.csproj
            label: MonoGame
          - project: src/AnimationChain.MonoGame/AnimationChain.KNI.csproj
            label: KNI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # nuget.org indexing lags a push by a few seconds; a consumer restoring this package right
      # after publish-animationeditorcommon finishes needs FlatRedBall2.AnimationEditorCommon to
      # already be resolvable at this exact version, not just pushed.
      - name: Wait for FlatRedBall2.AnimationEditorCommon to be resolvable on NuGet
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          VERSION_LOWER=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
          URL="https://api.nuget.org/v3-flatcontainer/flatredball2.animationeditorcommon/$VERSION_LOWER/flatredball2.animationeditorcommon.$VERSION_LOWER.nupkg"
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "FlatRedBall2.AnimationEditorCommon $VERSION is resolvable on NuGet."
              exit 0
            fi
            echo "Attempt $i/20: got HTTP $STATUS for $URL, waiting 15s..."
            sleep 15
          done
          echo "::error::FlatRedBall2.AnimationEditorCommon $VERSION never became resolvable on NuGet after 5 minutes."
          exit 1

      - name: Pack (${{ matrix.label }})
        run: >
          dotnet pack ${{ matrix.project }}
          -c Release
          -p:PackageVersion=${{ needs.resolve-version.outputs.version }}
          -o out

      # Guards against the same class of bug publish.yml already hit once: the ProjectReference to
      # AnimationEditorCommon auto-generates a <dependency> in this nuspec, and nothing else here
      # checks that its version actually matches what publish-animationeditorcommon pushed.
      - name: Verify AnimationEditorCommon dependency version
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          NUSPEC=$(unzip -p out/*.nupkg "*.nuspec")
          if ! echo "$NUSPEC" | grep -qF "<dependency id=\"FlatRedBall2.AnimationEditorCommon\" version=\"$VERSION\""; then
            echo "::error::Generated nuspec does not depend on FlatRedBall2.AnimationEditorCommon $VERSION. Aborting before publish."
            echo "$NUSPEC" | grep -i "AnimationEditorCommon" || echo "(no AnimationEditorCommon dependency found at all)"
            exit 1
          fi
          echo "Confirmed: nuspec depends on FlatRedBall2.AnimationEditorCommon $VERSION."

      - name: Publish to NuGet
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
